[package]
name = "pagelamp-llm"
description = "PageLamp's own model calls: API-key and local-model drivers behind the course AI policy gate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pagelamp-core.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
# `process` and `io-util`: the Codex commands (M2).
tokio = { workspace = true, features = ["time", "process", "io-util"] }
tokio-util = "0.7"
tracing.workspace = true
url.workspace = true
toml = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# Validates JSON answers locally. No default features: they fetch remote `$ref`s and bring a
# second TLS stack.
jsonschema = { version = "0.58", default-features = false }
# The Codex runtime (M2): its download is verified with SHA-256 and unpacked from zstd
# (a pure-Rust decoder, MIT).
sha2.workspace = true
ruzstd = "0.9"

[target.'cfg(unix)'.dependencies]
# Codex: Rosetta detection on macOS and the SIGINT that cancels a run.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Codex: the machine's native CPU (IsWow64Process2), the Authenticode check of `codex.exe`
# and CREATE_NO_WINDOW.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
pagelamp-core = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["net", "io-util"] }
tracing-subscriber.workspace = true
wiremock = "0.6"
