[package]
name = "pagelamp-core"
description = "PageLamp data model, local SQLite store, full-text search and course-timeline inference"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
chrono.workspace = true
chrono-tz = "0.10"
iana-time-zone = "0.1"
unicode-normalization = "0.1"
serde.workspace = true
serde_json.workspace = true
toml = "0.9"
schemars.workspace = true
rusqlite.workspace = true
pagelamp-extract.workspace = true
sha2.workspace = true
hex.workspace = true
regex.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
directories = "6.0"
keyring = "4.2"

[features]
# `ai_gate::RenderedPrompt::for_tests`, for the model drivers' tests only. Enabled only by
# dev-dependencies (pagelamp-app's crate-graph test checks it).
test-support = []

[dev-dependencies]
tempfile.workspace = true
